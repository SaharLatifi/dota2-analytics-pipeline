version: 2

sources:
  - name: matches
    database: DOTA2_RAW
    schema: raw
    description: Match-level and player-level data for Dota 2, appended over time as new matches are ingested
    config:
      meta:
        owner: sahar
        source: dota2
        source_type: api
        source_url: https://api.opendota.com/api/matches
        source_description: This data is sourced from the OpenDota API's match detail endpoint.
    tables:
      - name: matches
        description: Contains information about individual Dota 2 matches, one record per received API response (append-only; the same match_id can appear more than once)
        columns:
          - name: match_id
            description: The unique identifier for the match
            data_tests:
              - not_null
              - unique
          - name: start_time
            description: The Unix timestamp of when the match started
            data_tests:
              - not_null
          - name: duration
            description: The duration of the match in seconds
            data_tests:
              - not_null
          - name: radiant_win
            description: A boolean indicating whether the Radiant team won the match (true) or not (false)
            data_tests:
              - not_null
          - name: tower_status_radiant
            description: The status of the Radiant team's towers at the end of the match, represented as a bitmask
            data_tests:
              - not_null
          - name: tower_status_dire
            description: The status of the Dire team's towers at the end of the match, represented as a bitmask
            data_tests:
              - not_null
          - name: barracks_status_radiant
            description: Bitmask of the Radiant team's barracks left standing
            data_tests:
              - not_null
          - name: barracks_status_dire
            description: Bitmask of the Dire team's barracks left standing
            data_tests:
              - not_null
          - name: first_blood_time
            description: Seconds from match start to the first hero kill
            data_tests:
              - not_null
          - name: radiant_score
            description: Total hero kills by the Radiant team
            data_tests:
              - not_null
          - name: dire_score
            description: Total hero kills by the Dire team
            data_tests:
              - not_null
          - name: human_players
            description: Number of human-controlled players in the match (10 = a normal full match) — used to filter out broken/incomplete matches, not shown on the dashboard
            data_tests:
              - not_null
          - name: lobby_type
            description: Numeric code for how the match was organized (normal, ranked, tournament, etc.) — joins to constants_lobby_type
            data_tests:
              - not_null
          - name: game_mode
            description: Numeric code for the game/hero-selection rules used (All Pick, Turbo, etc.) — joins to constants_game_mode
            data_tests:
              - not_null
          - name: region
            description: Numeric code for the server/matchmaking region — joins to constants_region
            data_tests:
              - not_null
          - name: patch
            description: Identifier for the Dota 2 patch the match was played on — used as a dashboard filter
          - name: version
            description: OpenDota's parsed-data format version — not shown on the dashboard, but required by the dedup logic that picks the preferred row per match_id
          - name: _dlt_load_id
            description: Identifies the dlt load batch that inserted this row
            data_tests:
              - not_null
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null

      - name: matches__players
        description: One record per player per match
        columns:
          - name: account_id
            description: Identifies the player; missing for players with a private profile
          - name: rank_tier
            description: >
              This player's skill rank at the time of the match, encoded as a
              two-digit number — tens digit is the bracket (1=Herald ... 8=Immortal),
              ones digit is stars within that bracket. Split into rank_bracket_id
              and rank_star in staging; rank_bracket_id joins to dim_rank_tier.
          - name: player_slot
            description: The player's slot in the match
            data_tests:
              - not_null
          - name: hero_id
            description: The hero this player used — joins to heroes.id
            data_tests:
              - not_null
          - name: is_radiant
            description: True if this player was on the Radiant team, false if Dire
            data_tests:
              - not_null
          - name: win
            description: True if this player's team won the match
          - name: kills
            description: Enemy hero kills by this player
            data_tests:
              - not_null
          - name: deaths
            description: Times this player died
            data_tests:
              - not_null
          - name: assists
            description: Assisted hero kills by this player
            data_tests:
              - not_null
          - name: kda
            description: OpenDota-computed overall kill/death/assist performance score
          - name: gold_per_min
            description: Average gold earned per minute
          - name: xp_per_min
            description: Average experience earned per minute
          - name: level
            description: Hero level at the end of the match
          - name: net_worth
            description: Final total economic value (gold + item value)
          - name: last_hits
            description: Successful last hits on lane creeps
          - name: denies
            description: Denied last hits on the player's own creeps
          - name: hero_damage
            description: Total damage dealt to enemy heroes
          - name: tower_damage
            description: Total damage dealt to towers
          - name: hero_healing
            description: Total healing provided to allied heroes
          - name: teamfight_participation
            description: Share of teamfights this player took part in (0-1) — requires the match to be parsed by OpenDota
          - name: towers_killed
            description: Towers this player destroyed — requires the match to be parsed by OpenDota
          - name: roshans_killed
            description: Roshan kills by this player — requires the match to be parsed by OpenDota
          - name: lane
            description: Numeric code for the lane this player played — requires the match to be parsed by OpenDota
          - name: lane_role
            description: Numeric code for this player's assigned lane role (e.g. safe/mid/off/jungle) — requires the match to be parsed by OpenDota
          - name: lane_efficiency
            description: Laning-phase efficiency score — requires the match to be parsed by OpenDota
          - name: actions_per_min
            description: Player activity rate (actions per minute) — requires the match to be parsed by OpenDota
          - name: _dlt_parent_id
            description: Links to matches._dlt_id — identifies which match this player record belongs to
            data_tests:
              - not_null
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null

      - name: matches__radiant_gold_adv
        description: One record per minute of a match, giving the Radiant team's gold advantage over Dire at that point in time
        columns:
          - name: value
            description: Radiant's gold advantage in gold at this minute (negative means Dire is ahead)
          - name: _dlt_list_idx
            description: Position of this record in the original array — this is the minute mark of the match, and is what makes comeback/momentum analysis possible
          - name: _dlt_parent_id
            description: Links to matches._dlt_id — identifies which match this gold advantage record belongs to
            data_tests:
              - not_null
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null
