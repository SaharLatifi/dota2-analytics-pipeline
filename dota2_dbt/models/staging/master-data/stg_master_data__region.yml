version: 2

models:
  - name: stg_master_data__region
    description: >
      Cleaned, one-row-per-region reference data — renames and lightly
      reshapes constants_region from the raw layer. SCD Type 1, overwritten
      on every run.
    columns:
      - name: staging_region_id
        description: Surrogate key for this staging row, hashed from _dlt_id. Carries through to dim_region as its key at mart.
      - name: source_region_id
        description: The region's original numeric id, as OpenDota assigns it, cast from the raw layer's text representation to a number. Kept for lineage back to the source system.
      - name: region_name
        description: The region's display name (e.g. US West, Europe, Southeast Asia), trimmed of surrounding whitespace.
      - name: dlt_row_id
        description: Renamed from _dlt_id — lineage back to the raw row this came from.
      - name: dlt_load_id
        description: Renamed from _dlt_load_id — identifies which dlt load batch inserted the raw row.
