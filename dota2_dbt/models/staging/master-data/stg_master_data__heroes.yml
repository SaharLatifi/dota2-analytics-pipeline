version: 2

models:
  - name: stg_master_data__heroes
    description: >
      Cleaned, one-row-per-hero reference data — renames and lightly reshapes
      heroes from the raw layer. SCD Type 2 — tracks changes to a hero's
      role/attribute classification across patches instead of overwriting.
    columns:
      - name: staging_hero_id
        description: Surrogate key for this staging row, hashed from _dlt_id. Carries through to dim_hero as its key at mart.
      - name: source_hero_id
        description: The hero's original numeric id, as OpenDota assigns it. Kept for lineage back to the source system.
      - name: hero_name
        description: The hero's player-facing display name (e.g. Anti-Mage), trimmed of surrounding whitespace.
      - name: primary_attribute
        description: Renamed from primary_attr — the hero's primary attribute (str, agi, int, or all). Values are checked at the source layer, since this column passes through unchanged.
      - name: attack_type
        description: The hero's attack type (Melee or Ranged). Values are checked at the source layer, since this column passes through unchanged.
      - name: leg_count
        description: Renamed from legs — the number of legs the hero has.
      - name: dlt_row_id
        description: Renamed from _dlt_id — lineage back to the raw row this came from.
      - name: dlt_load_id
        description: Renamed from _dlt_load_id — identifies which dlt load batch inserted the raw row.
