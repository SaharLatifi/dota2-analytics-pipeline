version: 2

sources:
  - name: raw_master_data
    database: DOTA2_RAW
    schema: raw
    description: Master data for Dota 2, including heroes, items, and abilities
    config:
      meta:
        owner: sahar
        source: dota2
        source_type: api
        source_url: https://api.opendota.com/api/constants
        source_description: This data is sourced from the OpenDota API, which provides constant values for Dota 2 items.
    tables:
      - name: heroes
        description: Contains information about the heroes in Dota 2, one record per hero
        columns:
          - name: id
            description: The unique identifier for the hero
            data_tests:
              - not_null
              - unique
          - name: localized_name
            description: The player-friendly display name of the hero, e.g. Anti-Mage
            data_tests:
              - not_null
          - name: primary_attr
            description: The primary attribute of the hero (str, agi, int, or all)
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['str','agi','int','all']
          - name: attack_type
            description: The attack type of the hero (Melee or Ranged)
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Melee','Ranged']
          - name: legs
            description: The number of legs the hero has
          - name: _dlt_load_id
            description: Identifies the dlt load batch that inserted this row
            data_tests:
              - not_null
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null
              - unique

      - name: heroes__roles
        description: Contains information about the roles of the heroes in Dota 2, one record per hero role
        columns:
          - name: value
            description: The role classification of the hero, e.g. Carry, Support, Nuker, Escape
            data_tests:
              - not_null
          - name: _dlt_parent_id
            description: Links to heroes._dlt_id — identifies which hero this role belongs to
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw_master_data' , 'heroes')
                    field: _dlt_id
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - unique
              - not_null

      - name: constants_game_mode
        description: Contains information about the game modes in Dota 2, one record per game mode
        columns:
          - name: id
            description: The unique identifier for the game mode
            data_tests:
              - not_null
              - unique
          - name: name
            description: The internal system name of the game mode, e.g. All Pick, Captains Mode, Turbo
            data_tests:
              - not_null
          - name: balanced
            description: Indicates whether the game mode is considered balanced (true or false, could be null if unknown)
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null
              - unique
          - name: _dlt_load_id
            description: Identifies the dlt load batch that inserted this row
            data_tests:
              - not_null

      - name: constants_lobby_type
        description: Contains information about the lobby types in Dota 2, one record per lobby type
        columns:
          - name: id
            description: The unique identifier for the lobby type
            data_tests:
              - not_null
              - unique
          - name: name
            description: The internal system name of the lobby type, e.g. Public Matchmaking, Practice, Tournament
            data_tests:
              - not_null
          - name: balanced
            description: Indicates whether the lobby type is considered balanced (true or false, could be null if unknown)
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null
              - unique
          - name: _dlt_load_id
            description: Identifies the dlt load batch that inserted this row
            data_tests:
              - not_null

      - name: constants_region
        description: Contains information about the regions in Dota 2, one record per region
        columns:
          - name: id
            description: The unique identifier for the region
            data_tests:
              - not_null
              - unique
          - name: name
            description: The internal system name of the region, e.g. US West, Europe, Southeast Asia
            data_tests:
              - not_null
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests:
              - not_null
              - unique
          - name: _dlt_load_id
            description: Identifies the dlt load batch that inserted this row
            data_tests:
              - not_null

      - name: constants_items
        description: Contains information about the items in Dota 2, one record per item
        columns:
          - name: id 
            description: The unique identifier for the item — the id that match players' item slots (item_0–item_5) refer to
            data_tests: 
              - not_null
              - unique
          - name: dname
            description: The display name of the item, e.g. Blink Dagger, Black King Bar. A few items have no display name, and some names repeat across upgrade levels (e.g. Dagon)
            data_tests:
              - dbt_utils.not_null_proportion:
                  arguments:
                    at_least: 0.9
          - name: cost
            description: The cost of the item in gold. 0 is a real value (about 200 items cost nothing), and a few items have no cost at all
            data_tests: 
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: true
              - dbt_utils.not_null_proportion:
                  arguments:
                    at_least: 0.9
          - name: _dlt_id
            description: Unique technical identifier generated by dlt for this row
            data_tests: 
              - not_null
              - unique                 
          - name: _dlt_load_id
            description: Identifies the dlt load batch that inserted this row
            data_tests: 
              - not_null


