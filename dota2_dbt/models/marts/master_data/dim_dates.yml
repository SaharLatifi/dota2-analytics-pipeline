models:
  - name: dim_dates
    description: >
      Date dimension — one row per calendar day from 2010-01-01 through
      2027-12-31 (a fixed spine, not derived from match data). No synthetic
      'Unknown' row — nothing currently joins to this table, and match_date
      on fct_match is itself a required attribute (rows with a null
      match_date are filtered out before they reach the mart), not an FK
      that can legitimately miss a lookup, so there's no orphan case for an
      Unknown row to cover.
    columns:
      - name: date_id
        description: Surrogate key, hashed from date_day.
        data_tests:
          - not_null
          - unique
      - name: date_day
        description: The calendar date itself.
        data_tests:
          - not_null
          - unique
      - name: year_number
        description: Calendar year of date_day.
      - name: month_number
        description: Calendar month (1-12) of date_day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: day_number
        description: Day of month (1-31) of date_day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 31
      - name: is_weekend
        description: Whether date_day falls on a Saturday or Sunday.
      - name: business_season
        description: Rough seasonal bucket (Holiday/Summer/Spring/Off Season) used for reporting.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Holiday Season', 'Summer Season', 'Spring Season', 'Off Season']
