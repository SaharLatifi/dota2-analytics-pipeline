models:
  - name: dim_region
    description: >
      Region reference dimension — one row per server region, plus a
      synthetic 'Unknown' row for any fact row whose region can't be
      resolved. SCD Type 1 (overwritten in place), fully rebuilt from
      staging on every run.
    columns:
      - name: region_id
        description: Surrogate key, hashed from source_region_id. The 'Unknown' row's key is the literal '-1', not a hash, so it's a stable, obviously-synthetic value.
        data_tests:
          - not_null
          - unique
      - name: source_region_id
        description: OpenDota's own region id. Null only on the synthetic 'Unknown' row.
        data_tests:
          - not_null:
              config:
                where: "region_name != 'Unknown'"
          - unique:
              config:
                where: "region_name != 'Unknown'"
      - name: staging_region_id
        description: Carried straight through from staging for lineage. Null only on the synthetic 'Unknown' row.
        data_tests:
          - not_null:
              config:
                where: "region_name != 'Unknown'"
      - name: region_name
        description: Display name of the region, or 'Unknown' for the synthetic row.
        data_tests:
          - not_null
      - name: created_at
        description: When this row was last (re)built — this table is fully replaced every run, not merged, so there's no separate "first inserted" moment to track.
        data_tests:
          - not_null
      - name: updated_at
        description: Same as created_at — identical on every row since the whole table is rebuilt together.
        data_tests:
          - not_null
