models:
  - name: dim_role
    description: >
      Role reference dimension — one row per distinct role label seen across
      every version of scd_master_data_heroes__roles, plus a synthetic
      'Unknown' row. There's no source_role_id/staging_role_id here because
      OpenDota never gives roles their own id — only text values on a hero's
      roles list — so role_name itself is the natural key.
    columns:
      - name: role_id
        description: Surrogate key, hashed from role_name. The 'Unknown' row's key is hashed from a fixed literal instead.
        data_tests:
          - not_null
          - unique
      - name: role_name
        description: The role label (e.g. Carry, Support, Nuker), or 'Unknown' for the synthetic row.
        data_tests:
          - not_null
          - unique
      - name: created_at
        description: When this row was last (re)built — this table is fully replaced every run, not merged, so there's no separate "first inserted" moment to track.
        data_tests:
          - not_null
      - name: updated_at
        description: Same as created_at — identical on every row since the whole table is rebuilt together.
        data_tests:
          - not_null
