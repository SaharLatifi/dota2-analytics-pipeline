models:
  - name: dim_team
    description: >
      Team dimension — Radiant and Dire, the two sides of a Dota 2 match.
      Hand-authored 2-row seed, not sourced from the API. No synthetic
      'Unknown' row here (unlike the other master-data dimensions) — every
      match player is always on one of exactly these two sides, so there's
      no orphan case to cover.
    columns:
      - name: team_id
        description: Surrogate key, hashed from source_team_id.
        data_tests:
          - not_null
          - unique
      - name: source_team_id
        description: The team's natural key from the seed (1 = Radiant, 2 = Dire).
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [1, 2]
      - name: team_name
        description: Display name of the team (Radiant or Dire).
        data_tests:
          - not_null
      - name: created_at
        description: When this row was last (re)built — this table is fully replaced every run, not merged, so there's no separate "first inserted" moment to track.
        data_tests:
          - not_null
      - name: updated_at
        description: Same as created_at — identical on every row since the whole table is rebuilt together.
        data_tests:
          - not_null
