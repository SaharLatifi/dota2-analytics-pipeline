name: dota2_dbt

profile: dota2_dbt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into 'staging_seed'
  dota2_dbt:
    +schema: seed

models:
  dota2_dbt:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    
    # Materialize marts as tables
    marts:
      +database: DOTA2_MART
      +materialized: table
      master_data:
        +schema: master_data
      matches:
        +schema: matches


